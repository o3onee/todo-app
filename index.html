<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
</head>

<body>
  <div class="container mx-auto px-2">
    <div id="authorization">
    </div>
    <div id="control" class="control hidden">
      <div id="inputDiv" class="flex mx-auto justify-center gap-x-2 pt-8 pb-4">
        <div class="">
        <input id="input" type="text" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-400 focus:ring focus:ring-primary-200 focus:ring-opacity-50 disabled:cursor-not-allowed disabled:bg-gray-50 disabled:text-gray-500" placeholder="Новая задача" />
      </div>
        <button id="addData"
          class="rounded-lg border border-gray-300 bg-white px-5 py-2.5 text-center text-sm font-medium text-gray-700 shadow-sm transition-all hover:bg-gray-100 focus:ring focus:ring-gray-100 disabled:cursor-not-allowed disabled:border-gray-100 disabled:bg-gray-50 disabled:text-gray-400">Добавить
          задачу</button>
      </div>
      <div class="flex items-center justify-center gap-x-3">
        <button id="doneButton" class="">Выполненные задачи</button>
        <button id="unDoneButton" class="">Невыполненные задачи</button>
        <button id="all" class="">Все задачи</button>
        <button id="reset"
          class="rounded-lg border border-red-600 bg-white px-5 py-2.5 text-center text-sm font-medium text-gray-700 shadow-sm transition-all hover:bg-gray-100 focus:ring focus:ring-gray-100 disabled:cursor-not-allowed disabled:border-gray-100 disabled:bg-gray-50 disabled:text-gray-400">Удалить
          все</button>
      </div>
      <div class="flex items-center justify-center">
        <ul id="output" class="">
        </ul>
      </div>
  
    </div>
  </div>


  <script type="module" src="./app.js"></script>
</body>

</html>
